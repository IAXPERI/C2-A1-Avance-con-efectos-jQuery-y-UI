<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="foilShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="520" height="360" rx="14" fill="url(#bgGrad)"/>
  <circle cx="430" cy="60" r="110" fill="#4F46E5" opacity="0.07"/>
  <circle cx="80" cy="300" r="95" fill="#088395" opacity="0.06"/>

  <!-- Floor reflection -->
  <ellipse cx="260" cy="332" rx="195" ry="12" fill="#0F172A" opacity="0.09"/>

  <!-- 3D Left Side of Suture Box -->
  <polygon points="48,55 72,40 72,290 48,308" fill="url(#boxSide)"/>
  <polygon points="48,55 72,40 372,40 348,55" fill="#F1F5F9"/>

  <!-- Main Suture Dispenser Box -->
  <g filter="url(#shadow)">
    <rect x="48" y="55" width="300" height="253" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Top Brand Header on Box -->
    <rect x="48" y="55" width="300" height="44" rx="6" fill="#0A4D68"/>
    <rect x="48" y="85" width="300" height="14" fill="#0A4D68"/>
    <text x="66" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">SUTUMED</text>
    <circle cx="177" cy="70" r="4" fill="#38BDF8"/>
    <text x="242" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#BAE6FD">DISTRIBUIDO POR MATERMED</text>

    <!-- Official USP Color Band -->
    <rect x="48" y="99" width="300" height="34" fill="#4F46E5"/>
    <text x="66" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">POLIDIOXANONA (PDO)</text>

    <!-- USP Gauge Large Callout -->
    <rect x="66" y="147" width="76" height="64" rx="6" fill="#F8FAFC" stroke="#4F46E5" stroke-width="2"/>
    <text x="104" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B">CALIBRE USP</text>
    <text x="104" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="900" fill="#0F172A">1</text>
    <text x="104" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#4F46E5">4.0 Metric</text>

    <!-- Technical Specs on Box -->
    <text x="154" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Monofilamento Sintético Absorbible de Largo Plazo</text>
    <text x="154" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Aguja: 1/2 Círculo Ahusada Pesada (CTX) 48mm</text>
    <text x="154" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">Longitud hebra: 90 cm  |  Color: VIOLETA / PLATA</text>
    <text x="154" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">Absorción: 180 - 210 días</text>

    <!-- Needle Vector Illustration on Box -->
    <rect x="66" y="224" width="264" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 88 236 A 20 20 0 0 0 128 236" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="236" r="2.2" fill="#0F172A"/>
    <!-- Suture thread wave -->
    <path d="M 128 236 C 145 236, 150 256, 168 256 C 185 256, 192 238, 210 245" fill="none" stroke="#4338CA" stroke-width="2" stroke-dasharray="1,0"/>
    <!-- Needle point cross-section icon -->
    <circle cx="242" cy="247" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
    <circle cx="242" cy="247" r="3" fill="#0F172A"/>
    <text x="262" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">STERILE EO</text>
    <text x="262" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748B">ISO 13485 / CE</text>

    <!-- Box Footer -->
    <line x1="66" y1="281" x2="330" y2="281" stroke="#E2E8F0" stroke-width="1"/>
    <text x="66" y="297" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#0A4D68">REF: SM-PDO-1048</text>
    <text x="330" y="297" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">Caja x 12 Sobres Estériles</text>
  </g>

  <!-- Overlapping Sterile Foil Pouch (Right Foreground) -->
  <g filter="url(#foilShadow)" transform="translate(305, 118) rotate(4)">
    <rect x="0" y="0" width="175" height="202" rx="10" fill="url(#foilGrad)" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Foil tear notches -->
    <polygon points="0,24 7,28 0,32" fill="#64748B"/>
    <polygon points="175,24 168,28 175,32" fill="#64748B"/>
    <line x1="8" y1="28" x2="167" y2="28" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Inner Label on Foil Pouch -->
    <rect x="12" y="38" width="151" height="148" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="12" y="38" width="151" height="22" rx="6" fill="#4F46E5"/>
    <rect x="12" y="52" width="151" height="8" fill="#4F46E5"/>
    <text x="22" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">SUTUMED® STERILE</text>

    <text x="22" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="900" fill="#0F172A">1</text>
    <text x="65" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#334155">1 HEBRA ESTÉRIL</text>
    <text x="65" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#64748B">90 cm Con Aguja</text>

    <!-- Coiled suture loop preview inside packet -->
    <ellipse cx="87" cy="126" rx="52" ry="26" fill="none" stroke="#4338CA" stroke-width="2.2" opacity="0.85"/>
    <ellipse cx="87" cy="126" rx="46" ry="21" fill="none" stroke="#4338CA" stroke-width="1.6" opacity="0.65"/>
    <path d="M 65 118 A 14 14 0 0 0 95 118" fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round"/>

    <text x="87" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="9" font-weight="700" fill="#475569">LOT 2026-SM  |  EXP 2030</text>
  </g>
</svg>
